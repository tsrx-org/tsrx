# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
kotlin.stdlib.default.dependency=false

# IntelliJ Platform build used to compile and run platform tests.
targetPlatformVersion=2025.2.4

# Verify against the same WebStorm build used to compile and test the plugin.
org.jetbrains.intellij.platform.verifyPluginDefaultRecommendedIdes=false

# Marketplace plugin version. Synchronized from package.json.
pluginVersion=0.0.82
