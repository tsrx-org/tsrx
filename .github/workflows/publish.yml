name: Publish

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  publish:
    if: >-
      github.repository == 'tsrx-org/tsrx' &&
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, 'Version Packages')
    permissions:
      contents: write
      id-token: write
    name: Publish
    runs-on: ubuntu-latest
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    outputs:
      intellij-version-changed: ${{ steps.intellij.outputs.changed }}
      intellij-version: ${{ steps.intellij.outputs.version }}
      zed-version-changed: ${{ steps.zed.outputs.changed }}
      zed-tag: ${{ steps.zed.outputs.tag }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          # Do not enable dependency caching in this workflow. This job has
          # id-token: write and publishes to npm, so restoring shared Actions
          # cache here can turn cache poisoning into a trusted publish compromise.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Disallow major and minor bumps in changesets
        run: pnpm changeset:check

      - name: Detect IntelliJ plugin release
        id: intellij
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          previous_version="$(git show "${BEFORE_SHA}:packages/intellij-plugin/package.json" | jq -r .version)"
          version="$(jq -r .version packages/intellij-plugin/package.json)"

          if [ -z "$previous_version" ] || [ -z "$version" ]; then
            echo "Could not determine the previous and current IntelliJ plugin versions." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "$previous_version" = "$version" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Detect Zed extension release
        id: zed
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          previous_version="$({
            git show "${BEFORE_SHA}:packages/zed-plugin/extension.toml" || true
          } | sed -n 's/^version = "\([^"]*\)"/\1/p')"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' packages/zed-plugin/extension.toml)"

          if [ -z "$previous_version" ] || [ -z "$version" ]; then
            echo "Could not determine the previous and current Zed extension versions." >&2
            exit 1
          fi

          if [ "$previous_version" = "$version" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=@tsrx/zed-plugin@$version" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PNPM_CONFIG_PROVENANCE: true
          # keep for now just in case
          NPM_CONFIG_PROVENANCE: true

  publish-zed:
    name: Publish Zed extension
    needs: publish
    if: >-
      needs.publish.result == 'success' &&
      needs.publish.outputs.zed-version-changed == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    concurrency:
      group: zed-publish
      cancel-in-progress: false
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate Zed publishing credential
        env:
          GH_TOKEN: ${{ secrets.ZED_EXTENSION_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "Missing repository secret: ZED_EXTENSION_TOKEN" >&2; exit 1; }
          test "$(gh api user --jq .login)" = "leonidaz" || { echo "ZED_EXTENSION_TOKEN must belong to leonidaz" >&2; exit 1; }
          test "$(gh api repos/leonidaz/extensions --jq '.permissions.push')" = "true" || { echo "ZED_EXTENSION_TOKEN cannot push to leonidaz/extensions" >&2; exit 1; }

      - name: Tag Zed extension release
        env:
          ZED_TAG: ${{ needs.publish.outputs.zed-tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$ZED_TAG"; then
            tagged_sha="$(git rev-list -n 1 "$ZED_TAG")"
            if [ "$tagged_sha" != "$GITHUB_SHA" ]; then
              echo "$ZED_TAG already points to $tagged_sha instead of $GITHUB_SHA." >&2
              exit 1
            fi
            exit 0
          fi

          git tag "$ZED_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$ZED_TAG"

      - name: Submit Zed extension update
        # This action updates the registry version and submodule commit, but not
        # the submodule URL. The one-time source migration in
        # zed-industries/extensions#7328 must merge before the next Zed version
        # bump reaches main.
        uses: huacnlee/zed-extension-action@82920ff0876879f65ffbcfa3403589114a8919c6
        with:
          extension-name: tsrx
          push-to: leonidaz/extensions
          tag: ${{ needs.publish.outputs.zed-tag }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Classic PAT owned by leonidaz with repo and workflow scopes.
          COMMITTER_TOKEN: ${{ secrets.ZED_EXTENSION_TOKEN }}

  publish-intellij-plugin:
    name: Publish IntelliJ plugin
    needs: publish
    if: >-
      needs.publish.result == 'success' &&
      needs.publish.outputs.intellij-version-changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/publish-intellij-plugin.yml
    with:
      version: ${{ needs.publish.outputs.intellij-version }}
    secrets:
      JETBRAINS_MARKETPLACE_CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_MARKETPLACE_CERTIFICATE_CHAIN }}
      JETBRAINS_MARKETPLACE_PRIVATE_KEY: ${{ secrets.JETBRAINS_MARKETPLACE_PRIVATE_KEY }}
      JETBRAINS_MARKETPLACE_PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_MARKETPLACE_PRIVATE_KEY_PASSWORD }}
      JETBRAINS_MARKETPLACE_PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_PUBLISH_TOKEN }}
