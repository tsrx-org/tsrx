name: CI

on:
  push:
    branches: [main, develop]
    tags: ["!**"]
    paths:
      - "packages/**"
      - "grammars/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/**"
      - "vitest.config.js"
      - ".changeset/**"
      - ".github/workflows/ci.yml"

  pull_request:
    branches: [main, develop]
    paths:
      - "packages/**"
      - "grammars/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/**"
      - "vitest.config.js"
      - ".changeset/**"
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24, 26]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        # tree-sitter-cli downloads its binary from GitHub without retrying.
        run: |
          for attempt in 1 2 3; do
            if pnpm install --prod false --frozen-lockfile; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "::warning::Dependency installation failed (attempt $attempt/3); retrying in 5 seconds"
            sleep 5
          done

      - name: Build eslint-parser
        working-directory: ./packages/eslint-parser
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Test Hono with Bun
        run: pnpm --filter @tsrx/bun-plugin-hono test:native

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "::warning::Dependency installation failed (attempt $attempt/3); retrying in 5 seconds"
            sleep 5
          done

      - name: Check formatting
        run: pnpm format:check

  changeset-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Disallow major and minor bumps in changesets
        run: node scripts/check-changesets.js

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "::warning::Dependency installation failed (attempt $attempt/3); retrying in 5 seconds"
            sleep 5
          done

      - name: Type check
        run: pnpm typecheck

  grammar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Tree-sitter grammar
        run: pnpm --filter @tsrx/tree-sitter test

      - name: Verify generated grammar files
        run: |
          pnpm --filter @tsrx/tree-sitter generate
          pnpm regenerate-textmate
          pnpm copy-tree-sitter-queries
          git diff --exit-code
